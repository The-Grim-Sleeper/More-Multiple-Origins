 # From Xahkarias' xhk decision origins

 edict_decision_origins_star_slingshot: "Decision Origins: Slingshot to the Stars"
 edict_decision_origins_star_slingshot_desc: "Spawns the catapult and archaeology site in an adjacent system, and gives the ability to fix it + research the Quantum Catapult tech."
 edict_decision_origins_star_slingshot_desc_tt: "For compatibility purposes, acts as if the Quantum Catapult Insight astral action was used."

 edict_decision_origins_cosmic_dawn: "Decision Origins: Cosmic Dawn"
 edict_decision_origins_cosmic_dawn_desc: "Begins the special project, Deep Excavation situation, and Interstellar Refugia quest chain."
 edict_decision_origins_cosmic_dawn_desc_tt: "Flavor text may not make much sense if you aren't infernal. Restrictions on this decision origin are intentionally relaxed."

 edict_decision_origins_calamitous_birth: "Decision Origins: Calamitous Birth"
 edict_decision_origins_calamitous_birth_desc: "Gives the capital planetary feature and the new features on colonization."
 edict_decision_origins_calamitous_birth_tt: "Does not give access to the special colony ship, but gives the normal colony ship the asteroid colonization effects."

 edict_decision_origins_clone_army: "Decision Origins: Clone Army"
 edict_decision_origins_clone_army_desc: "Gives the associated techs, building, traits, and event chain."

 edict_decision_origins_synthetic_fertility: "Decision Origins: Synthetic Fertility"
 edict_decision_origins_synthetic_fertility_desc: "Gives the situation, buildings, and pop traits of the Synthetic Fertility situation.\n$decision_origins_cache_warning$$decision_origins_modify_warning$"
 edict_decision_origins_synthetic_fertility_tt: "Gives all species the Pathogenic Genes trait. Be careful with other things that give you extra starting pops.\n§RMAKE SURE YOU HAVE 2 FREE BUILDINGS SLOTS IN THE GOVERNMENT ZONE OF YOUR CAPITAL§!\n§RDOES NOT GIVE EXTRA DRAW CHANCE FOR THE SYNTH RELATED TECHS§!"

 edict_decision_origins_shroudwalker_apprentice: "Decision Origins: Shroudwalker Apprentice"
 edict_decision_origins_shroudwalker_apprentice_desc: "Gives contact with the Shroudwalker enclave and the Latent Psionic trait.\n$decision_origins_cache_warning$$decision_origins_modify_warning$"
 edict_decision_origins_shroudwalker_apprentice_tt: "Does not give some of the flavor events, nor the shroud tunnel starbase building"

 decision_origins_cache_warning: "§RNOTE: WHEN TAKING A DECISION ORIGIN THAT MODIFIES YOUR POPS, WAIT 1 DAY BEFORE TAKING ANOTHER ONE!\nTHIS ORIGIN IS LOCKED UNTIL 1 DAY HAS PASSED, TO ALLOW FOR GAMESETUP TO COMPLETE§!\n\n"
 decision_origins_modify_warning: "§HNOTE: WHEN TAKING A DECISION ORIGIN THAT MODIFIES YOUR POPS, OTHER POPS OF THE SAME SPECIES IN OTHER EMPIRES WILL ALSO BE MODIFIED (NOT DEFAULT ROBOTS). FOR EXAMPLE, PRE-FTLS WITH THE BROKEN SHACKLES ORIGIN§!\n\n"

